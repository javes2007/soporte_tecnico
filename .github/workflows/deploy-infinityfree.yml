name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Evita que varios commits publiquen a la vez y que una versión anterior
# termine sobrescribiendo archivos de una versión más reciente.
concurrency:
  group: infinityfree-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar sitio por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Validar credenciales y generar configuración privada
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ("DB_HOST", "DB_NAME", "DB_USER", "DB_PASSWORD")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Faltan secretos de GitHub: " + ", ".join(missing)
                  + ". Configúralos en Settings > Secrets and variables > Actions."
              )

          def php_string(value):
              encoded = base64.b64encode(value.encode("utf-8")).decode("ascii")
              return "base64_decode('" + encoded + "')"

          content = "<?php\nreturn [\n"
          content += "    'host' => " + php_string(os.environ["DB_HOST"]) + ",\n"
          content += "    'name' => " + php_string(os.environ["DB_NAME"]) + ",\n"
          content += "    'user' => " + php_string(os.environ["DB_USER"]) + ",\n"
          content += "    'password' => " + php_string(os.environ["DB_PASSWORD"]) + ",\n"
          content += "];\n"
          Path("config-hosting.php").write_text(content, encoding="utf-8")
          PY

      - name: Validar sintaxis PHP antes de publicar
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Revisar archivos PHP
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Verificar que el FTP pertenece a Soporte Técnico
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ]; then
            echo "Faltan FTP_SERVER o FTP_USERNAME en los secretos de GitHub."
            exit 1
          fi
          if [ "$FTP_USERNAME" != "if0_43219755" ]; then
            echo "Despliegue detenido por seguridad: FTP_USERNAME no corresponde a la cuenta de Soporte Técnico (if0_43219755). Corrige el secreto antes de publicar."
            exit 1
          fi
          echo "Usuario FTP validado para la cuenta de Soporte Técnico."

      - name: Sincronizar archivos con InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          # Estado nuevo para forzar una sincronización completa sin borrar archivos del hosting.
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.env
            database.sql
            README.md
          dangerous-clean-slate: false

# Redeploy solicitado el 2026-10-23 para volver a sincronizar todos los archivos.
